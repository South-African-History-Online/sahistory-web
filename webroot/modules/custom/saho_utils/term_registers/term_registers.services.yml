services:
  term_registers.redirect_subscriber:
    class: Drupal\term_registers\EventSubscriber\TermRegisterRedirectSubscriber
    arguments:
      - '@current_route_match'
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  term_registers.legacy_list_redirect_subscriber:
    class: Drupal\term_registers\EventSubscriber\LegacyListRedirectSubscriber
    arguments:
      - '@config.factory'
    tags:
      - { name: event_subscriber }
