saho_refs.resolve:
  path: '/ref/{ref}'
  defaults:
    _controller: 'Drupal\saho_refs\Controller\RefController::resolve'
  requirements:
    _permission: 'access content'
    # Trailing punctuation (comma, full stop, etc.) is tolerated so a reference
    # scraped from citation text still routes; RefController::resolve strips it.
    ref: '[A-Za-z]-\d+[.,;:]*'
