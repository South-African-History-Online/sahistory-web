# Dependabot configuration file
# See https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Check for updates to npm packages in the theme
  - package-ecosystem: "npm"
    directory: "/webroot/themes/custom/saho"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "South-African-History-Online/frontend-developers"
    ignore:
      # stylelint 18 removed rules that stylelint-config-standard-scss 17 /
      # stylelint-scss 7 still set; lift once those declare stylelint ^18.
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
    # One PR per run: every theme dependency, majors included, lands in a
    # single grouped PR instead of one PR per package.
    groups:
      theme-dependencies:
        patterns:
          - "*"

  # Check for updates to Composer packages
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "South-African-History-Online/backend-developers"
    ignore:
      # Ignore major updates to Drupal core and modules that might require manual intervention
      - dependency-name: "drupal/core*"
        update-types: ["version-update:semver-major"]
    # One PR per run: Drupal modules and the rest of the PHP tree together,
    # majors included (core majors stay ignored above).
    groups:
      composer-dependencies:
        patterns:
          - "*"